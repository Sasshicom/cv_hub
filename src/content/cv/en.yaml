name: Ksenia Vadimovna Kharichkova
title: Event Marketing Specialist
location: Novosibirsk
summary_short: Over ten years of experience in events and project management.
summary: >-
  I have over ten years of experience organizing events and managing projects. I develop
  event concepts and programs, plan event calendars, and bring in partners, speakers, and
  participants. I handle pre- and post-event communications, including announcements,
  visuals, and event recaps for social media. I have organized city and district events,
  festivals, and educational and business gatherings. My work in entertainment included
  preparing advertising campaigns, planning social media content, and looking for sponsors.


  As part of the core organizing team for the Cinema on the Grass festival, I ran the
  main-stage program. I selected bands and speakers, worked with partners, and coordinated
  participants. The festival drew more than 1,000 attendees. I also helped organize the
  Made in Siberia and Created by Youth events.


  I have worked with FC Sibir, HC Sibir, Samokat, Alfa-Bank, the Novosibirsk Mayor's Office,
  the Novosibirsk Region Department of Youth Policy, and the regional Children's Rights
  Commissioner. I have also worked with venues, rental companies, technical crews,
  photographers, videographers, print shops, and caterers.


  Based in Novosibirsk and seeking full-time work. Open to on-site, hybrid, and remote roles.

