name: Харичкова Ксения Вадимовна
title: Event-маркетолог
location: Новосибирск
summary_short: Более 5 лет организую и продвигаю мероприятия.
summary: >-
  Более 5 лет работаю с мероприятиями и проектами: разрабатываю концепции и программы, веду
  календарное планирование, привлекаю партнёров, спикеров и участников. Готовлю коммуникации до и
  после событий: анонсы, визуальные материалы и пострелизы для соцсетей. Организовывала городские и
  районные события, фестивали, образовательные и деловые встречи. Для развлекательных проектов
  готовила рекламные кампании, составляла контент-планы и искала спонсоров.


  В команде главных организаторов фестиваля «Кино на траве» отвечала за программу главной сцены:
  подбирала музыкальные группы и спикеров, взаимодействовала с партнёрами и координировала
  участников программы. Фестиваль посетили более 1 000 человек. Также участвовала в организации
  мероприятий «Сделано в Сибири» и «Создано молодыми».


  Взаимодействовала с ФК и ХК «Сибирь», «Самокатом», Альфа-Банком, мэрией Новосибирска,
  департаментом молодёжной политики Новосибирской области и Уполномоченным по правам ребёнка
  Новосибирской области. Работала с площадками, арендными службами, техническими специалистами,
  фотографами, видеографами, типографиями и кейтерингом.


  Новосибирск. Ищу работу на полную занятость. Рассматриваю офисный, гибридный и удалённый форматы.

